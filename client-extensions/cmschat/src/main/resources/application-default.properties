#
# Liferay LXC (Local Development Defaults)
#
com.liferay.lxc.dxp.domains=localhost:8080
com.liferay.lxc.dxp.mainDomain=localhost:8080
com.liferay.lxc.dxp.server.protocol=http

#
# OAuth
#

liferay.oauth.application.external.reference.codes=\
    liferay-cmschat-oauth-application-user-agent

liferay.oauth.urls.excludes=/ready

#
# Spring Boot
#

server.port=58081

#
# CMS 2.0
#
cms2.display.page.base.url=https://webserver-abcxyz-prd.lfr.cloud
cms2.blog.display.page.template.id=34997
cms2.press.release.display.page.template.id=99342

#
# CMS Chat
#
security.oauth2.resourceserver.jwk.jwk-set-uri=http://localhost:8080/o/oauth2/jwks

liferay.headless.api.base.url=http://localhost:8080/o

logging.level.root=INFO
logging.level.com.liferay.demo.cmschat=DEBUG
